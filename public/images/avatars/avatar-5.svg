<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d1e18" />
      <stop offset="60%" stop-color="#1c0b08" />
      <stop offset="100%" stop-color="#080202" />
    </radialGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc" />
      <stop offset="40%" stop-color="#f5c242" />
      <stop offset="80%" stop-color="#ab7718" />
      <stop offset="100%" stop-color="#543806" />
    </linearGradient>
    <linearGradient id="crimsonMantle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="60%" stop-color="#580e0e" />
      <stop offset="100%" stop-color="#260404" />
    </linearGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="14" fill="url(#bg5)" />
  <rect width="126" height="126" x="1" y="1" rx="13" fill="none" stroke="url(#gold5)" stroke-width="2" opacity="0.9" />

  <!-- Royal Crest / Lion Silhouette behind -->
  <circle cx="64" cy="52" r="32" fill="none" stroke="#663319" stroke-width="2" opacity="0.4" />

  <!-- Shoulders with Crimson Royal Mantle & Golden Epaulets -->
  <path d="M18 120 C20 94 38 82 64 82 C90 82 108 94 110 120 Z" fill="url(#crimsonMantle)" stroke="#2b0808" stroke-width="2" />
  <!-- Golden Brooch with Ruby -->
  <circle cx="64" cy="92" r="6.5" fill="url(#gold5)" stroke="#4a2805" stroke-width="1.5" />
  <circle cx="64" cy="92" r="3.5" fill="#e11d48" filter="url(#royalGlow)" />

  <!-- Hero Head / Golden Circlet Crown -->
  <path d="M42 42 C42 28 50 20 64 20 C78 20 86 28 86 42 C86 64 78 76 64 78 C50 76 42 64 42 42 Z" fill="#241b18" stroke="#120c0a" stroke-width="2" />
  <!-- Platinum/Silver Hair Streaks -->
  <path d="M42 38 C44 26 52 20 64 20 C76 20 84 26 86 38 C84 34 76 28 64 28 C52 28 44 34 42 38 Z" fill="#c4cbd4" />

  <!-- Golden Crown of Thais -->
  <polygon points="40,28 44,14 52,24 64,8 76,24 84,14 88,28" fill="url(#gold5)" stroke="#52390a" stroke-width="1.5" />
  <circle cx="64" cy="14" r="2.5" fill="#ef4444" />
  <circle cx="45" cy="18" r="1.8" fill="#3b82f6" />
  <circle cx="83" cy="18" r="1.8" fill="#3b82f6" />

  <!-- Fierce Noble Eyes -->
  <ellipse cx="53" cy="48" rx="4" ry="2" fill="#60a5fa" filter="url(#royalGlow)" />
  <ellipse cx="75" cy="48" rx="4" ry="2" fill="#60a5fa" filter="url(#royalGlow)" />
  <circle cx="53" cy="48" r="1.2" fill="#ffffff" />
  <circle cx="75" cy="48" r="1.2" fill="#ffffff" />
</svg>
