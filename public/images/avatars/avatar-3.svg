<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142b1f" />
      <stop offset="60%" stop-color="#0a1710" />
      <stop offset="100%" stop-color="#020604" />
    </radialGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#735212" />
    </linearGradient>
    <linearGradient id="cloak3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a573a" />
      <stop offset="70%" stop-color="#163321" />
      <stop offset="100%" stop-color="#0a1a10" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="14" fill="url(#bg3)" />
  <rect width="126" height="126" x="1" y="1" rx="13" fill="none" stroke="#2ebb68" stroke-width="1.8" opacity="0.8" />

  <!-- Quiver / Bow Silhouette behind -->
  <path d="M96 16 L108 28 L36 100 L24 88 Z" fill="#2d1c10" stroke="#523821" stroke-width="1" opacity="0.5" />
  <circle cx="102" cy="22" r="3" fill="#d4af37" />

  <!-- Shoulders with Leather & Leaf Armor -->
  <path d="M22 118 C24 94 40 84 64 84 C88 84 104 94 106 118 Z" fill="url(#cloak3)" stroke="#09140c" stroke-width="2" />
  <path d="M46 86 L64 102 L82 86 Z" fill="#382115" stroke="#6b4426" stroke-width="1.5" />

  <!-- Ranger Hood -->
  <path d="M64 16 C46 16 36 28 36 50 C36 70 46 82 64 86 C82 82 92 70 92 50 C92 28 82 16 64 16 Z" fill="#1b3d27" stroke="#0b1a10" stroke-width="2" />

  <!-- Face / Shadowed Archer Features -->
  <path d="M44 44 C44 32 52 26 64 26 C76 26 84 32 84 44 C84 60 76 68 64 68 C52 68 44 60 44 44 Z" fill="#1f1a16" />
  <!-- Leather Half-Mask -->
  <path d="M45 52 C50 56 64 62 83 52 V66 C75 72 53 72 45 66 Z" fill="#3b2718" stroke="#1d120a" stroke-width="1" />

  <!-- Golden Crown of Leaves (Paladin Circlet) -->
  <path d="M40 34 Q64 26 88 34" stroke="url(#gold3)" stroke-width="2.5" fill="none" />
  <polygon points="64,22 67,29 64,32 61,29" fill="url(#gold3)" />
  <polygon points="50,26 53,32 50,34 47,31" fill="url(#gold3)" />
  <polygon points="78,26 81,31 78,34 75,32" fill="url(#gold3)" />

  <!-- Hawk-eyed Golden Amber Eyes -->
  <ellipse cx="54" cy="46" rx="4" ry="2" fill="#ffd13b" filter="url(#emeraldGlow)" />
  <ellipse cx="74" cy="46" rx="4" ry="2" fill="#ffd13b" filter="url(#emeraldGlow)" />
  <circle cx="54" cy="46" r="1.2" fill="#ffffff" />
  <circle cx="74" cy="46" r="1.2" fill="#ffffff" />
</svg>
