<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d133b" />
      <stop offset="60%" stop-color="#14061c" />
      <stop offset="100%" stop-color="#040108" />
    </radialGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59eff" />
      <stop offset="50%" stop-color="#bf36ff" />
      <stop offset="100%" stop-color="#670ba8" />
    </linearGradient>
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1a63" />
      <stop offset="60%" stop-color="#2a0d3b" />
      <stop offset="100%" stop-color="#13041c" />
    </linearGradient>
    <filter id="arcaneGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="14" fill="url(#bg2)" />
  <rect width="126" height="126" x="1" y="1" rx="13" fill="none" stroke="#a842eb" stroke-width="1.8" opacity="0.75" />

  <!-- Arcane Rune Ring behind head -->
  <circle cx="64" cy="54" r="34" fill="none" stroke="#9034d6" stroke-dasharray="6,4" stroke-width="1.5" opacity="0.5" />
  <circle cx="64" cy="54" r="28" fill="none" stroke="#e175ff" stroke-width="1" opacity="0.3" />

  <!-- Shoulders & High Collar Robes -->
  <path d="M20 120 C22 96 38 82 64 82 C90 82 106 96 108 120 Z" fill="url(#robeGrad)" stroke="#1a0624" stroke-width="2" />
  <path d="M38 88 L64 104 L90 88 L64 124 Z" fill="#200a2e" stroke="#5d1e82" stroke-width="1" />
  <!-- Amulet of the Void -->
  <polygon points="64,96 70,105 64,114 58,105" fill="#f075ff" stroke="#fff" stroke-width="1" filter="url(#arcaneGlow)" />

  <!-- Sorcerer Cowl / Hood -->
  <path d="M64 12 C44 12 34 26 34 46 C34 68 44 84 64 88 C84 84 94 68 94 46 C94 26 84 12 64 12 Z" fill="#38134d" stroke="#12031a" stroke-width="2" />
  <!-- Hood Peak -->
  <path d="M64 8 L67 14 H61 Z" fill="#581e7a" />

  <!-- Inner Hood Shadow (Deep Darkness) -->
  <path d="M42 46 C42 30 50 24 64 24 C78 24 86 30 86 46 C86 64 78 74 64 74 C50 74 42 64 42 46 Z" fill="#08010d" />

  <!-- Mystical Glowing Eyes (Twin violet flames) -->
  <ellipse cx="53" cy="48" rx="4.5" ry="2" fill="#ff7dff" transform="rotate(-8 53 48)" filter="url(#arcaneGlow)" />
  <ellipse cx="75" cy="48" rx="4.5" ry="2" fill="#ff7dff" transform="rotate(8 75 48)" filter="url(#arcaneGlow)" />
  <circle cx="53" cy="48" r="1.5" fill="#ffffff" />
  <circle cx="75" cy="48" r="1.5" fill="#ffffff" />

  <!-- Arcane Sparks -->
  <circle cx="36" cy="30" r="1.5" fill="#e887ff" opacity="0.8" />
  <circle cx="92" cy="34" r="1.2" fill="#e887ff" opacity="0.7" />
  <circle cx="64" cy="20" r="1" fill="#fff" opacity="0.9" />
</svg>
